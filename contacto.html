<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACTO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/contacto.css">
</head>
<body>
    <header>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="cards.html">Cards</a></li>
                <li><a href="galeria.html">Galería</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
          <div class="promo-text">
            <h2>¿Quieres un dia de belleza?</h2>
            <p>El acompáñamiento y ascesoria de un profesional.</p>
            <ul>
              <li>✓ Más Eficaz</li>
              <li>✓ Rápido</li>
              <li>✓ Más Seguro</li>
            </ul>
          </div>
          <div class="form-container">
            <h3>PIDE TU TURNO<br><span>! Completar !</span></h3>
            <form>
              <input type="text" placeholder="Nombre" class="form-control mb-2" required>
              <input type="email" placeholder="Email" class="form-control mb-2" required>
              <input type="tel" placeholder="Teléfono" class="form-control mb-2" required>
              <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="privacyCheck" required>
                <label class="form-check-label" for="privacyCheck">Acepto la <a href="#">Política de Privacidad</a></label>
              </div>
              <button type="submit" class="btn btn-primary w-100">QUIERO UN TURNO</button>
            </form>
          </div>
        </section>
      </main>
    <footer><p>Creado por Ariel Luciano</p></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
